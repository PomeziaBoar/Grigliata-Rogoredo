<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenotazione Grigliata</title>
    <style>
        :root { --primary: #d32f2f; --bg: #f8f9fa; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { color: var(--primary); text-align: center; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-family: sans-serif; font-size: 1rem; }
        textarea { resize: vertical; min-height: 80px; }
        .cat-group { margin-bottom: 10px; border: 1px solid #eee; border-radius: 8px; overflow: hidden; }
        .cat-header { background: #f1f1f1; padding: 15px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; }
        .cat-content { display: none; padding: 10px; }
        .item-card { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f9f9f9; }
        .total-bar { position: sticky; bottom: 0; background: var(--primary); color: white; padding: 20px; margin: 20px -25px -25px; text-align: center; font-size: 1.2rem; font-weight: bold; z-index: 10; }
        .send { width: 100%; padding: 18px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 1.1rem; }
        .send:disabled { background: #999 !important; cursor: not-allowed; }
        .chiuso-box { background: #fff3e0; border: 1px solid #ffb300; border-radius: 10px; padding: 20px; text-align: center; margin-top: 10px; color: #e65100; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="main-title">Grigliata Rogoredo</h1>
    <div id="loading" style="text-align:center; padding: 40px;">Caricamento listino...</div>

    <div id="chiuso-container" style="display:none;">
        <div class="chiuso-box" id="chiuso-msg"></div>
    </div>
    
    <div id="form-container" style="display:none;">
        <input type="text" id="user_name" placeholder="Tuo Nome e Cognome">
        <label style="font-weight:bold; margin-bottom:5px; display:block;">Quanti siete?</label>
        <input type="number" id="num_persone" placeholder="Numero persone" min="1" value="1">
        <div id="status-posti"></div>
        
        <div id="prodotti-list"></div>

        <textarea id="note_ordine" placeholder="Note aggiuntive (allergie, richieste speciali...)"></textarea>
        
        <div class="total-bar">Totale: <span id="display-total">0.00</span>€</div>
        <button class="send" id="btn-invia" onclick="inviaOrdine()">CONFERMA ORDINE</button>
    </div>

    <div id="successo" style="display:none; text-align:center;">
        <h2 style="color:#2e7d32;">Ordine Inviato! ✅</h2>
        <p>Mostra questo codice in cassa:</p>
        <h1 id="res-id" style="background:#f4f4f4; padding:20px; border: 2px dashed #ccc; letter-spacing: 5px;">---</h1>
        <button onclick="location.reload()" style="margin-top:20px; padding:10px; cursor:pointer;">Fai un nuovo ordine</button>
    </div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxj_rqGvL6KrX8MInyhXfZP0JHiYH83b5NQ4mf-ubrFFeHYqp72lNLmWofafT6sFu0CNQ/exec";
    let listino = [];
    let messaggioChiuso = "";

    async function loadData() {
        try {
            const resp = await fetch(WEB_APP_URL, { redirect: 'follow' });
            const data = await resp.json();
            listino = data.prodotti;
            messaggioChiuso = data.messaggioChiuso || "Le prenotazioni sono chiuse. Grazie!";
            document.getElementById('main-title').innerText = data.titolo;
            document.getElementById('loading').style.display = 'none';

            if (data.postiResidui <= 0) {
                document.getElementById('chiuso-msg').innerText = messaggioChiuso;
                document.getElementById('chiuso-container').style.display = 'block';
                return;
            }

            document.getElementById('status-posti').style.display = 'none';
            render();
            document.getElementById('form-container').style.display = 'block';
        } catch (e) {
            document.getElementById('loading').innerText = "Errore di connessione. Riprova.";
        }
    }

    function render() {
        const listDiv = document.getElementById('prodotti-list');
        const cats = [...new Set(listino.map(p => p.category))];
        cats.forEach(c => {
            const group = document.createElement('div');
            group.className = 'cat-group';
            group.innerHTML = `<div class="cat-header" onclick="toggleCat(this)">${c} <span>▼</span></div>`;
            const content = document.createElement('div');
            content.className = 'cat-content';
            listino.filter(p => p.category === c).forEach(p => {
                const prezzoVal = parseFloat(p.price) || 0;
                content.innerHTML += `
                    <div class="item-card">
                        <div><b>${p.name}</b><br><small>€${prezzoVal.toFixed(2)}</small></div>
                        <input type="number" id="qty_${p.key}" value="0" min="0" onchange="updateUI()" style="width:50px; margin:0">
                    </div>`;
            });
            group.appendChild(content);
            listDiv.appendChild(group);
        });
    }

    function toggleCat(el) {
        const content = el.nextElementSibling;
        content.style.display = content.style.display === 'block' ? 'none' : 'block';
    }

    function updateUI() {
        let tot = 0;
        listino.forEach(item => {
            const q = parseInt(document.getElementById('qty_' + item.key)?.value) || 0;
            tot += q * item.price;
        });
        document.getElementById('display-total').innerText = tot.toFixed(2);
    }

    async function inviaOrdine() {
        const btn = document.getElementById('btn-invia');
        const nome = document.getElementById('user_name').value.trim();
        const persone = parseInt(document.getElementById('num_persone').value) || 0;
        const note = document.getElementById('note_ordine').value.trim();

        if (!nome || persone < 1) return alert("Inserisci nome e numero persone!");

        const codiceOrdine = Math.random().toString(36).substring(2, 7).toUpperCase();

        const payload = {
            nome,
            persone,
            totale: document.getElementById('display-total').innerText,
            note: note,
            codice: codiceOrdine
        };

        let qtyTot = 0;
        listino.forEach(p => {
            const q = parseInt(document.getElementById('qty_' + p.key)?.value) || 0;
            if (q > 0) { payload['qty_' + p.key] = q; qtyTot++; }
        });

        if (qtyTot === 0) return alert("Scegli almeno un prodotto!");

        // Blocca il tasto per 30 secondi
        btn.disabled = true;
        let countdown = 30;
        const timer = setInterval(() => {
            countdown--;
            btn.innerText = `ATTENDI ${countdown}s...`;
            if (countdown <= 0) {
                clearInterval(timer);
                btn.innerText = "CONFERMA ORDINE";
                btn.disabled = false;
            }
        }, 1000);

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            });
            clearInterval(timer);
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('successo').style.display = 'block';
            document.getElementById('res-id').innerText = codiceOrdine;
        } catch (e) {
            clearInterval(timer);
            btn.disabled = false;
            btn.innerText = "CONFERMA ORDINE";
            alert("Errore nell'invio. Riprova tra poco.");
        }
    }

    loadData();
</script>
</body>
</html>
