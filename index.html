<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grigliata Rogoredo</title>
    <style>
        :root { --primary: #d32f2f; --bg: #f4f4f4; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { color: var(--primary); text-align: center; margin-bottom: 20px; }
        .cat-btn { width: 100%; padding: 15px; margin-top: 10px; background: #eee; border: none; border-radius: 8px; text-align: left; font-weight: bold; cursor: pointer; display: flex; justify-content: space-between; }
        .cat-content { display: none; padding: 10px; border: 1px solid #eee; border-top: none; border-radius: 0 0 8px 8px; }
        .item-card { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .item-info h3 { margin: 0; font-size: 1rem; }
        .price { color: #666; font-size: 0.9rem; }
        input[type="number"] { width: 45px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .bibita-row { width: 100%; background: #fff5f5; padding: 8px; margin-top: 8px; border-radius: 4px; font-size: 0.85rem; box-sizing: border-box; }
        select { width: 100%; padding: 5px; margin-top: 5px; }
        .total-bar { position: sticky; bottom: 0; background: var(--primary); color: white; padding: 15px; margin: 20px -20px -20px -20px; text-align: center; font-weight: bold; border-radius: 0 0 12px 12px; }
        .send-btn { width: 100%; padding: 15px; background: #2e7d32; color: white; border: none; border-radius: 8px; margin-top: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>Grigliata Rogoredo</h1>
    <div id="loading" style="text-align:center; padding:20px;">Caricamento listino...</div>
    
    <div id="form-container" style="display:none;">
        <input type="text" id="user_name" placeholder="Tuo Nome e Cognome" style="width:100%; padding:12px; margin-bottom:15px; box-sizing:border-box; border:1px solid #ccc; border-radius:6px;">
        <div id="prodotti-list"></div>
        <div class="total-bar">Totale: <span id="display-total">0.00</span>€</div>
        <button class="send-btn" onclick="inviaOrdine()">CONFERMA ORDINE</button>
    </div>

    <div id="conferma" style="display:none; text-align:center;">
        <h2 style="color:#2e7d32;">Inviato! ✅</h2>
        <p>Codice prenotazione:</p>
        <h1 id="res-id" style="background:#eee; padding:15px; letter-spacing:5px;">-----</h1>
        <button onclick="location.reload()" style="background:#666; color:white; border:none; padding:10px; border-radius:5px;">Nuovo ordine</button>
    </div>
</div>

<script>
    // --- METTI IL TUO URL QUI SOTTO ---
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwy-wsGtX-8VsczpRTS6XbSgl72kFBkPsAw9ZXWnjgZW7RNDehZHGpZ0DrMH-TdB7l-hA/exec"; 
    let listino = [];

    async function loadListino() {
        try {
            const resp = await fetch(WEB_APP_URL, { redirect: 'follow' });
            listino = await resp.json();
            render();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('form-container').style.display = 'block';
        } catch (e) { document.getElementById('loading').innerText = "Errore connessione."; }
    }

    function render() {
        const listDiv = document.getElementById('prodotti-list');
        const cats = [...new Set(listino.map(i => i.category))];
        
        cats.forEach(c => {
            const btn = document.createElement('button');
            btn.className = 'cat-btn';
            btn.innerHTML = `<span>${c}</span><span>+</span>`;
            btn.onclick = () => {
                const content = btn.nextElementSibling;
                content.style.display = content.style.display === 'block' ? 'none' : 'block';
            };
            
            const cont = document.createElement('div');
            cont.className = 'cat-content';
            
            listino.filter(i => i.category === c).forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-info"><h3>${item.name}</h3><span class="price">€${Number(item.price).toFixed(2)}</span></div>
                    <input type="number" id="qty_${item.key}" value="0" min="0" onchange="updateUI('${item.key}')">
                    <div id="bibs_${item.key}" style="width:100%"></div>
                `;
                cont.appendChild(card);
            });
            listDiv.appendChild(btn);
            listDiv.appendChild(cont);
        });
    }

    function updateUI(key) {
        const q = parseInt(document.getElementById('qty_' + key).value) || 0;
        const container = document.getElementById('bibs_' + key);
        if (key.startsWith('men_')) {
            container.innerHTML = '';
            for (let i = 1; i <= q; i++) {
                container.innerHTML += `<div class="bibita-row">Bibita #${i}: <select class="sel-bib" data-parent="${key}">
                    <option value="coca">Coca Cola</option><option value="fan">Fanta</option><option value="spr">Sprite</option>
                    <option value="thl">The Limone</option><option value="thp">The Pesca</option><option value="bir_p">Birra Piccola</option>
                </select></div>`;
            }
        }
        let tot = 0;
        listino.forEach(i => tot += (parseInt(document.getElementById('qty_'+i.key).value)||0) * Number(i.price));
        document.getElementById('display-total').innerText = tot.toFixed(2);
    }

    async function inviaOrdine() {
        const nome = document.getElementById('user_name').value;
        if(!nome) return alert("Inserisci il nome");
        const orderId = Math.random().toString(36).substring(2,7).toUpperCase();
        const payload = { nome: nome, ordine: orderId };
        
        listino.forEach(i => {
            const q = document.getElementById('qty_'+i.key).value;
            if(q > 0) payload['qty_'+i.key] = q;
        });

        // Prende le bibite selezionate
        document.querySelectorAll('.sel-bib').forEach((s, idx) => {
            payload['bibita_' + idx] = s.value;
        });

        await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        document.getElementById('form-container').style.display = 'none';
        document.getElementById('conferma').style.display = 'block';
        document.getElementById('res-id').innerText = orderId;
    }

    loadListino();
</script>
</body>
</html>
