<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prenotazione Grigliata</title>
    <style>
        :root { --primary: #d32f2f; --bg: #f4f4f4; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { color: var(--primary); text-align: center; margin-top: 0; }
        .item-card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 10px; position: relative; }
        .item-card h3 { margin: 0; font-size: 1.1rem; }
        .price { color: #666; font-size: 0.9rem; }
        input[type="number"] { width: 50px; padding: 5px; border-radius: 4px; border: 1px solid #ccc; float: right; }
        input[type="text"] { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        .menu-select { margin-top: 10px; display: none; background: #fff8f8; padding: 10px; border-radius: 4px; border: 1px solid #ffe0e0; }
        select { width: 100%; padding: 8px; margin-top: 5px; }
        .total-bar { position: sticky; bottom: 0; background: var(--primary); color: white; padding: 15px; margin: 20px -20px -20px -20px; border-radius: 0 0 12px 12px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        button { width: 100%; padding: 15px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; margin-top: 10px; }
        #loading { text-align: center; color: #666; padding: 20px; }
    </style>
</head>
<body>

<div class="container" id="main-content">
    <h1>Grigliata Rogoredo</h1>
    <div id="loading">Caricamento listino...</div>
    
    <div id="form-container" style="display:none;">
        <label>Nome e Cognome</label>
        <input type="text" id="user_name" placeholder="Inserisci il tuo nome">
        
        <div id="prodotti-list"></div>
        
        <div class="total-bar">Totale: <span id="display-total">0.00</span>€</div>
        <button onclick="inviaOrdine()">CONFERMA ORDINE</button>
    </div>

    <div id="conferma" style="display:none; text-align: center;">
        <h2 style="color: #2e7d32;">Ordine Inviato! ✅</h2>
        <p>Il tuo codice prenotazione è:</p>
        <h1 id="res-id" style="background: #eee; padding: 10px; letter-spacing: 5px;">-----</h1>
        <p>Totale da pagare alla cassa: <span id="res-tot">0</span>€</p>
        <button onclick="location.reload()" style="background: #666;">Fai un altro ordine</button>
    </div>
</div>

<script>
    // --- CONFIGURAZIONE ---
    const WEB_APP_URL = https://script.google.com/macros/s/AKfycbwGsmYzxf46MwmDLa_F6jZ2BJoFTKzyXCI3pi7HvJgZuAWCRFTasAW8yze0WPZ-wXP_fQ/exec;
    let listino = [];

    // --- CARICAMENTO DINAMICO ---
async function loadListino() {
    try {
        // Aggiungiamo { redirect: 'follow' } per gestire il comportamento di Google
        const response = await fetch(WEB_APP_URL, { redirect: 'follow' });
        if (!response.ok) throw new Error('Network response was not ok');
        listino = await response.json();
        renderProdotti();
        document.getElementById('loading').style.display = 'none';
        document.getElementById('form-container').style.display = 'block';
    } catch (e) {
        console.error("Errore dettagliato:", e);
        document.getElementById('loading').innerText = "Errore nel caricamento del listino. Verifica la console del browser.";
    }
}

    function renderProdotti() {
        const listDiv = document.getElementById('prodotti-list');
        listino.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            
            let html = `
                <h3>${item.name}</h3>
                <span class="price">€${item.price.toFixed(2)}</span>
                <input type="number" id="qty_${item.key}" value="0" min="0" onchange="updateUI('${item.key}')">
            `;

            // Aggiunge la scelta bibita se è un menu
            if (item.key.startsWith('men_')) {
                html += `
                    <div id="select_${item.key}" class="menu-select">
                        <label>Scegli bibita/birra:</label>
                        <select id="bibita_${item.key}">
                            <option value="coca">Coca Cola</option>
                            <option value="fan">Fanta</option>
                            <option value="spr">Sprite</option>
                            <option value="thl">The Limone</option>
                            <option value="thp">The Pesca</option>
                            <option value="bir_p">Birra Piccola (Inclusa)</option>
                        </select>
                    </div>
                `;
            }
            card.innerHTML = html;
            listDiv.appendChild(card);
        });
    }

    function updateUI(key) {
        const qty = document.getElementById('qty_' + key).value;
        const selectDiv = document.getElementById('select_' + key);
        if (selectDiv) selectDiv.style.display = qty > 0 ? 'block' : 'none';
        
        let totale = 0;
        listino.forEach(item => {
            const q = document.getElementById('qty_' + item.key).value;
            totale += q * item.price;
        });
        document.getElementById('display-total').innerText = totale.toFixed(2);
    }

    function generaID() {
        const c = 'BCDFGHJKLMNPQRSTVWXYZ';
        let res = '';
        for (let i = 0; i < 5; i++) res += c.charAt(Math.floor(Math.random() * c.length));
        return res;
    }

    async function inviaOrdine() {
        const nome = document.getElementById('user_name').value;
        if (!nome) return alert("Inserisci il tuo nome!");

        const orderId = generaID();
        const payload = { nome: nome, ordine: orderId };
        
        listino.forEach(item => {
            payload['qty_' + item.key] = document.getElementById('qty_' + item.key).value;
            if (item.key.startsWith('men_')) {
                payload['bib_scelta_' + (item.key.includes('ham') ? 'ham' : 'sal')] = document.getElementById('bibita_' + item.key).value;
            }
        });

        document.getElementById('form-container').style.opacity = "0.5";
        
        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(payload)
            });
            
            document.getElementById('form-container').style.display = 'none';
            document.getElementById('conferma').style.display = 'block';
            document.getElementById('res-id').innerText = orderId;
            document.getElementById('res-tot').innerText = document.getElementById('display-total').innerText;
        } catch (e) {
            alert("Errore invio: " + e);
        }
    }

    loadListino();
</script>

</body>
</html>
